name: Test

on:
  pull_request:

# 경로 필터는 워크플로 레벨 paths가 아니라 job 레벨 if 스킵으로 처리한다.
# 워크플로 레벨 paths는 미실행 시 required check가 Expected 상태로 남아 병합을 영구히 잠그지만,
# if로 스킵된 job은 통과로 취급되어 Ruleset required check와 안전하게 결합된다.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      ios: ${{ steps.filter.outputs.ios }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      # pull_request 이벤트에서는 checkout 없이 GitHub API로 변경 파일을 조회한다
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - 'fixtures/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/test.yml'
            # 세 플랫폼 테스트가 자기 디렉터리 밖도 읽는다 - FilePcmSource 테스트가 안드로이드 쪽 가짜
            # 마이크 WAV(app/src/debug/assets)를, PublishedGuideF0 테스트가 발행본 gn-2026.09.4 SQL
            # (fixtures/definitions, Accentury_Server backend 마이그레이션의 복사본, KAN-221)을 연다.
            # fixtures/**를 세 필터에 다 넣는다: 새 발행본이 들어오면 세 테스트가 같이 깨져야 한다.
            ios:
              - 'ios/**'
              - 'fixtures/**'
              - '.github/workflows/test.yml'
            web:
              - 'web/**'
              - 'fixtures/**'
              - '.github/workflows/test.yml'

  app-test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest

  # app-test의 iOS 대응물 (KAN-37). macos-26을 박는 이유는 Xcode 26.x가 거기에만 있어서다 -
  # macos-15는 Xcode 16.x라 이 프로젝트를 열지 못한다 (ios/README.md 「필요한 것」).
  #
  # macOS 러너는 리눅스의 10배로 과금된다. 그래서 위 필터로 ios/**가 바뀐 PR에서만 돌리고,
  # job도 하나만 둔다 - 스킴 Accentury의 test 액션이 앱 계층(AccenturyTests)과 순수 Swift
  # 계층(AccenturyCoreTests)을 함께 돌리므로, `swift test` job을 따로 붙이면 같은 테스트를
  # 두 번 세면서 러너 시간만 더 쓴다 (ios/project.yml의 schemes.Accentury.test).
  #
  # xcodegen은 돌리지 않는다. 커밋된 Accentury.xcodeproj를 그대로 쓰면 brew 설치가 한 단계
  # 없어지고, 러너가 여는 프로젝트가 리뷰에 올라온 그 파일이 된다.
  #
  # 아직 required check로 올리지 않는다 (edge-test와 같은 취급 - 안정화 후 별도 결정).
  ios-test:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # 러너 이미지는 예고 없이 갈린다. 실패가 우리 코드인지 도구 버전인지 가르는 첫 줄이라
      # 로그 맨 앞에 남겨 둔다.
      - name: 도구 버전
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      # 시뮬레이터 기기 이름은 이미지마다 다르다 - 로컬처럼 'iPhone 17 Pro'를 박아 두면
      # 이미지가 올라가는 날 destination을 못 찾아 죽는다. 가용 목록에서 골라 UDID로 준다.
      #
      # `// empty`가 있어야 아래 -z 검사가 산다. 목록이 비면 last가 null이 되고 jq -r는 그걸
      # 네 글자 "null"로 찍어서, 없는 기기를 찾았다고 착각한 채 grep에서 엉뚱하게 죽는다.
      - name: 시뮬레이터 고르기
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | sort_by(.name) | last | .udid // empty')
          if [ -z "$udid" ]; then
            echo "가용 iPhone 시뮬레이터가 없다 - 러너 이미지를 확인할 것"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # CODE_SIGNING_ALLOWED=NO - 팀 ID가 든 Local.xcconfig는 gitignore라 CI에 없고, 그게
      # 정상 상태다. 시뮬레이터 빌드는 서명이 필요 없으므로 이 한 줄로 넘어간다.
      #
      # xcbeautify는 러너 이미지에 들어 있지만 없어도 돌게 두고, pipefail로 xcodebuild의
      # 실패가 파이프에 먹히지 않게 한다.
      - name: 단위 테스트
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          run_tests() {
            xcodebuild -project Accentury.xcodeproj -scheme Accentury -configuration Debug \
              -destination "id=$SIM_UDID" CODE_SIGNING_ALLOWED=NO \
              -resultBundlePath TestResults.xcresult test
          }
          if command -v xcbeautify >/dev/null; then
            run_tests | xcbeautify --renderer github-actions
          else
            run_tests
          fi

      # xcresult에는 테스트별 로그와 실패 지점이 들어 있다. 콘솔 출력만으로는 재구성이 안 되므로
      # 러너가 사라지기 전에 건져 둔다.
      - name: 실패 증거 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

  web-test:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      # tsc --noEmit + vite build - 타입 오류와 번들 실패를 PR에서 잡는다
      - run: npm run build

  # 브라우저 E2E (KAN-181)는 2026-09-05에 CI에서 내렸다 (KAN-22). 그 job은 로컬 풀스택
  # (DB + AI + BE, 지금은 Accentury_Server 루트 compose) 위에서 돌았는데, AI 서버의 베이스가 채점
  # 모델 전달본이 되면서 러너에서 띄울 수 없게 됐다 - 4GB 이미지에 RSS 7GB대이고 추론 1건이
  # 14~30초다. 스펙 파일(web/e2e)은 남겨 두었고, 분석이 필요한 전 구간 확인은 staging 스모크가
  # 맡는다 (Accentury_Server deploy.yml). 되살리려면 다른 레포를 checkout해야 하므로 별도 결정이다.
  # backend, ai, edge 테스트는 Accentury_Server의 test.yml이 돈다 (KAN-221).
