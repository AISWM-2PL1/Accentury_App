[versions]
agp = "9.3.1"
coreKtx = "1.19.0"
coreSplashscreen = "1.2.0"
browser = "1.10.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
coroutinesTest = "1.10.2"
okhttp = "5.4.0"
kotlinxSerialization = "1.9.0"
kakaoSdk = "2.24.0"
firebaseBom = "34.18.0"
googleServices = "4.5.0"
firebaseCrashlyticsPlugin = "3.0.8"
playServicesAds = "25.4.0"
datastorePreferences = "1.2.1"
credentials = "1.6.0"
googleId = "1.2.0"
naverOauth = "5.12.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
# Custom Tabs (KAN-177). 개인정보처리방침을 인트로 위 시트로 연다 - WebView 안에서 열면
# 인트로가 사라지고 돌아올 길이 없다.
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kakao-share = { group = "com.kakao.sdk", name = "v2-share", version.ref = "kakaoSdk" }
# 카카오 로그인 (KAN-224). 공유와 같은 SDK 묶음이라 버전을 kakaoSdk 하나로 같이 올린다 - 둘이 갈리면
# v2-common·v2-auth가 서로 다른 버전으로 끌려온다.
kakao-user = { group = "com.kakao.sdk", name = "v2-user", version.ref = "kakaoSdk" }
# 구글 로그인 (KAN-224). Credential Manager + Sign in with Google. credentials 1.6.0 = Google Maven 최신 안정판
# (2026-09-28 확인, 1.7.0은 alpha). googleid는 1.2.0 - 최신 1.2.1은 Kotlin 2.4 메타데이터로 빌드돼 우리
# 컴파일러(2.2)가 못 읽는다. Kotlin을 올릴 때 같이 올린다. https://developer.android.com/identity/sign-in/credential-manager-siwg
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }
# 네이버 로그인 (KAN-224). 옛 이름 naveridlogin-sdk-android의 현재 좌표다 - 5.12.0 = Maven Central 최신
# (2026-09-28 확인). https://github.com/naver/naveridlogin-sdk-android
naver-oauth = { group = "com.navercorp.nid", name = "oauth", version.ref = "naverOauth" }
# 익명 계측·크래시 (KAN-33). 두 SDK의 버전은 BoM 하나가 잡는다 - 같은 firebase-common 위에 서 있어
# 따로 올리면 조합이 어긋난다. 그래서 아래 둘에는 version이 없다.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
# 광고 (KAN-196). Firebase BoM과는 별개 아티팩트라 버전을 직접 박는다 - BoM은 firebase-* 좌표만
# 잡고 play-services-ads는 그 목록에 없다. 25.4.0 = 2026-06-17 릴리스 (developers.google.com/admob/android/rel-notes),
# Google Maven maven-metadata의 latest와 같다 (2026-09-11 확인). minSdk 23+·compileSdk 35+ 요구.
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }
# 계정 토큰 저장 (KAN-224). Keystore로 암호화한 토큰 쌍을 여기 둔다 - EncryptedSharedPreferences는 deprecated.
# 1.2.1 = 최신 안정판 (developer.android.com/topic/libraries/architecture/datastore, Google Maven
# maven-metadata에서 1.3.0은 아직 alpha, 2026-09-28 확인).
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# 계측·크래시 플러그인 (KAN-33). 둘 다 google-services.json이 있을 때만 적용한다 - 설정 파일이
# 없으면 설정 단계에서 빌드를 죽이기 때문이다 (app/build.gradle.kts의 조건부 apply 주석 참고).
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }

